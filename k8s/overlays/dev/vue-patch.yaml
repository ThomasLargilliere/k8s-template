apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue
  namespace: myapp
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: vue
          imagePullPolicy: IfNotPresent
          env:
            - name: ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: ALLOWED_HOSTS
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5173
          livenessProbe:
            httpGet:
              path: /
              port: 5173
