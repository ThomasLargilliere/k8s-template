apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: myapp
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: django
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - python manage.py migrate && python manage.py runserver 0.0.0.0:8000
