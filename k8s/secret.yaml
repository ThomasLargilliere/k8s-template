apiVersion: v1
kind: Secret
metadata:
  name: myapp-env
  namespace: myapp
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-long-random-secret-key"
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,myapp.local"
  CSRF_TRUSTED_ORIGINS: "https://myapp.example.com"
  DB_NAME: "myapp"
  DB_USER: "myapp_user"
  DB_PASSWORD: "myapp_password"
  DB_HOST: "db"
  DB_PORT: "3306"
  MARIADB_DATABASE: "myapp"
  MARIADB_USER: "myapp_user"
  MARIADB_PASSWORD: "myapp_password"
  MARIADB_ROOT_PASSWORD: "root_password"
