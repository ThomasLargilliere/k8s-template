apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp-bootstrap-scripts
  namespace: myapp
data:
  wait-for-postgres.sh: |
    #!/bin/sh
    set -eu

    until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}"; do
      echo "Waiting for PostgreSQL to accept connections..."
      sleep 5
    done

    echo "PostgreSQL is ready!"
