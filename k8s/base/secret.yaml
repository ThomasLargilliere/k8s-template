apiVersion: v1
kind: Secret
metadata:
  name: myapp-env
  namespace: myapp
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-long-random-secret-key"
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,myapp.local"
  CSRF_TRUSTED_ORIGINS: "https://myapp.example.com"
  DB_NAME: "myapp"
  DB_USER: "myapp_user"
  DB_PASSWORD: "myapp_password"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  POSTGRES_DB: "myapp"
  POSTGRES_USER: "myapp_user"
  POSTGRES_PASSWORD: "myapp_password"
