apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: myapp
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: django
          image: your-registry/myapp-django:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
          envFrom:
            - configMapRef:
                name: myapp-config
            - secretRef:
                name: myapp-env
          ports:
            - containerPort: 8000
