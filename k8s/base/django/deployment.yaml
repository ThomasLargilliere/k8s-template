apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: myapp
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          envFrom:
            - configMapRef:
                name: myapp-config
            - secretRef:
                name: myapp-env
          volumeMounts:
            - name: bootstrap-scripts
              mountPath: /opt/bootstrap
              readOnly: true
          command:
            - sh
            - /opt/bootstrap/wait-for-postgres.sh
      containers:
        - name: django
          image: your-registry/myapp-django:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
          envFrom:
            - configMapRef:
                name: myapp-config
            - secretRef:
                name: myapp-env
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: bootstrap-scripts
          configMap:
            name: myapp-bootstrap-scripts
            defaultMode: 0755
        - name: media
          persistentVolumeClaim:
            claimName: django-media
