apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: myapp
build:
  artifacts:
    - image: your-registry/myapp
      context: ./app
      docker:
        dockerfile: Dockerfile
  local:
    push: false
manifests:
  rawYaml:
    - k8s/namespace.yaml
    - k8s/secret.yaml
    - k8s/db/deployment.yaml
    - k8s/db/service.yaml
    - k8s/web/deployment.dev.yaml
    - k8s/web/service.yaml
    - k8s/ingress.yaml
deploy:
  kubectl: {}
