apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: myapp
build:
  artifacts:
    - image: your-registry/myapp-django
      context: ./django
      docker:
        dockerfile: Dockerfile
    - image: your-registry/myapp-vue
      context: ./vue
      docker:
        dockerfile: Dockerfile
  local:
    push: false
manifests:
  kustomize:
    paths:
      - k8s/overlays/dev
deploy:
  kubectl: {}
